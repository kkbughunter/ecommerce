spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: ecommercebackend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: ${SQL_INIT_MODE:always}
  jpa:
    defer-datasource-initialization: true
    open-in-view: ${SPRING_JPA_OPEN_IN_VIEW:false}
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
  servlet:
    multipart:
      max-file-size: ${IMAGE_MAX_FILE_SIZE:50MB}
      max-request-size: ${IMAGE_MAX_REQUEST_SIZE:200MB}

server:
  port: ${SERVER_PORT:8080}

upload:
  image:
    max-files-per-request: ${IMAGE_MAX_FILES_PER_REQUEST:8}
    max-file-bytes: ${IMAGE_MAX_FILE_BYTES:52428800}
    max-pixels: ${IMAGE_MAX_PIXELS:50000000}
    worker-delay-ms: ${IMAGE_WORKER_DELAY_MS:5000}
    worker-batch-size: ${IMAGE_WORKER_BATCH_SIZE:5}
    max-processing-attempts: ${IMAGE_MAX_PROCESSING_ATTEMPTS:3}

r2:
  enabled: ${R2_ENABLED:false}
  endpoint: ${R2_ENDPOINT:}
  access-key-id: ${R2_ACCESS_KEY_ID:}
  secret-access-key: ${R2_SECRET_ACCESS_KEY:}
  bucket: ${R2_BUCKET:}
  public-url: ${R2_PUBLIC_URL:}

frontend:
  url: ${FRONTEND_URL:http://localhost:3000}

jwt:
  secret: ${JWT_SECRET:change-me-with-a-secure-key-at-least-32-bytes}
  expiration: ${JWT_EXPIRATION:3600}
  refresh:
    expiration: ${JWT_REFRESH_EXPIRATION:86400}

auth:
  otp:
    expiration-minutes: ${AUTH_OTP_EXPIRATION_MINUTES:10}

bootstrap:
  admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin@yourstore.com}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin@123}
    full-name: ${BOOTSTRAP_ADMIN_FULL_NAME:Store Admin}
  super-admin:
    email: ${BOOTSTRAP_SUPER_ADMIN_EMAIL:superadmin@yourstore.com}
    password: ${BOOTSTRAP_SUPER_ADMIN_PASSWORD:SuperAdmin@123}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html
    disable-swagger-default-url: true

razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  api-base-url: ${RAZORPAY_API_BASE_URL:https://api.razorpay.com}
  create-order-timeout-ms: ${RAZORPAY_CREATE_ORDER_TIMEOUT_MS:10000}
